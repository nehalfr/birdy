const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const GROUND = 70;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
}
addEventListener('resize', fit); fit();

// ---- Face ----
let face = null;
(function () {
  const img = new Image();
  img.onload = () => { face = img; };
  img.src = FACE_DATA;
})();

// ---- Sounds ----
const tapSnds = [new Audio(TAP1_DATA), new Audio(TAP2_DATA)];
const outSnd = new Audio(OUT_DATA);
[...tapSnds, outSnd].forEach(a => { a.preload = 'auto'; a.load(); });
function play(a) {
  try { a.cloneNode().play().catch(() => {}); } catch (e) {}
}

// 2-3 tap sound 1, phir 2-3 tap sound 2, phir repeat
let tapIdx = 0, tapLeft = 2 + (Math.random() < 0.5 ? 1 : 0);
function playTap() {
  play(tapSnds[tapIdx]);
  if (--tapLeft <= 0) {
    tapIdx = 1 - tapIdx;
    tapLeft = 2 + (Math.random() < 0.5 ? 1 : 0);
  }
}

// ---- Settings ----
const GRAVITY = 0.45;
const FLAP = -7.5;
const PIPE_W = 60;
const GAP = 150;
const PIPE_SPEED = 2.4;
const PIPE_EVERY = 95;

// ---- State ----
let bird, pipes, score, best = 0, frame, state, groundX = 0, overTimer = 0;
try { best = +localStorage.getItem('birdyBest') || 0; } catch (e) {}

function reset() {
  bird = { x: 90, y: H / 2 - 30, vy: 0, r: 16, rot: 0 };
  pipes = [];
  score = 0;
  frame = 0;
  tapIdx = 0; tapLeft = 2 + (Math.random() < 0.5 ? 1 : 0);
  state = 'ready';
}
reset();

function flap() {
  if (state === 'ready') state = 'play';
  if (state === 'play') { bird.vy = FLAP; playTap(); }
  else if (state === 'over' && overTimer <= 0) reset();
}

addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });

function addPipe() {
  const min = 80, max = H - GROUND - GAP - 70;
  pipes.push({ x: W, top: Math.random() * (max - min) + min, passed: false });
}

function die() {
  if (state === 'over') return;
  state = 'over';
  overTimer = 30;
  play(outSnd);
  if (score > best) {
    best = score;
    try { localStorage.setItem('birdyBest', best); } catch (e) {}
  }
}

function update() {
  if (state !== 'over') groundX = (groundX - PIPE_SPEED) % 24;
  if (overTimer > 0) overTimer--;

  if (state === 'ready') {
    bird.y = H / 2 - 30 + Math.sin(frame / 10) * 8;
    frame++;
    return;
  }

  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rot = Math.max(-0.5, Math.min(1.2, bird.vy / 10));

  if (state === 'play') {
    frame++;
    if (frame % PIPE_EVERY === 1) addPipe();
    for (const p of pipes) {
      p.x -= PIPE_SPEED;
      if (!p.passed && p.x + PIPE_W < bird.x) { p.passed = true; score++; }
      const inX = bird.x + bird.r - 3 > p.x && bird.x - bird.r + 3 < p.x + PIPE_W;
      if (inX && (bird.y - bird.r + 3 < p.top || bird.y + bird.r - 3 > p.top + GAP)) die();
    }
    pipes = pipes.filter(p => p.x > -PIPE_W - 10);
    if (bird.y - bird.r < 0) { bird.y = bird.r; bird.vy = 0; }
  }

  if (bird.y + bird.r >= H - GROUND) {
    bird.y = H - GROUND - bird.r;
    if (state === 'play') die();
    bird.vy = 0;
  }
}

// ---- Drawing ----
function drawCloud(x, y) {
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.beginPath();
  ctx.arc(x, y, 18, 0, 7); ctx.arc(x + 20, y - 8, 22, 0, 7); ctx.arc(x + 42, y, 16, 0, 7);
  ctx.fill();
}

function bamboo(x, y0, y1) {
  const h = y1 - y0;
  if (h <= 0) return;
  ctx.fillStyle = '#7cb342';
  ctx.fillRect(x, y0, PIPE_W, h);
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.fillRect(x + 8, y0, 8, h);
  ctx.fillStyle = 'rgba(0,0,0,.15)';
  ctx.fillRect(x + PIPE_W - 12, y0, 12, h);
  ctx.fillStyle = '#558b2f';
  for (let y = y0 + 20; y < y1 - 6; y += 48) ctx.fillRect(x - 3, y, PIPE_W + 6, 8);
  ctx.strokeStyle = '#33691e';
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y0, PIPE_W, h);
}

function drawPipe(p) {
  bamboo(p.x, -4, p.top);
  bamboo(p.x, p.top + GAP, H - GROUND);
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);

  if (face) {
    const R = bird.r + 11;
    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip();
    const s = Math.max(2 * R / face.width, 2 * R / face.height);
    ctx.drawImage(face, -face.width * s / 2, -face.height * s / 2, face.width * s, face.height * s);
    ctx.restore();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.stroke();
    const w = state === 'play' && bird.vy < 0 ? -8 : 4;
    ctx.fillStyle = '#e8573d';
    ctx.beginPath(); ctx.ellipse(-R + 2, w, 9, 5, -0.4, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = '#e8573d';
    ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7a2615'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffd9b0';
    ctx.beginPath(); ctx.ellipse(2, 5, 8, 6, 0, 0, 7); ctx.fill();
    const w = state === 'play' && bird.vy < 0 ? -6 : 3;
    ctx.fillStyle = '#b8381f';
    ctx.beginPath(); ctx.ellipse(-4, w, 8, 5, -0.3, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(7, -5, 5, 0, 7); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(9, -5, 2.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffb300';
    ctx.beginPath(); ctx.moveTo(13, -1); ctx.lineTo(24, 3); ctx.lineTo(13, 7); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawGround() {
  ctx.fillStyle = '#ded895';
  ctx.fillRect(0, H - GROUND, W, GROUND);
  ctx.fillStyle = '#8bc34a';
  ctx.fillRect(0, H - GROUND, W, 14);
  ctx.fillStyle = '#6fa33a';
  for (let x = groundX; x < W; x += 24) ctx.fillRect(x, H - GROUND, 12, 14);
}

function text(t, x, y, size, color = '#fff') {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  ctx.textAlign = 'center';
  ctx.lineWidth = size / 6;
  ctx.strokeStyle = '#000';
  ctx.strokeText(t, x, y);
  ctx.fillStyle = color;
  ctx.fillText(t, x, y);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawCloud(60, 110); drawCloud(240, 70); drawCloud(170, 200);
  pipes.forEach(drawPipe);
  drawGround();
  drawBird();

  if (state === 'play') text(score, W / 2, 80, 48);

  if (state === 'ready') {
    text('Birdy Jump', W / 2, 150, 44, '#ffeb3b');
    text('Tap / Space dabao', W / 2, 400, 24);
    text('Best: ' + best, W / 2, 440, 20);
  }

  if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(0, 0, W, H);
    text('Game Over', W / 2, 200, 46, '#ff5252');
    text('Score: ' + score, W / 2, 270, 30);
    text('Best: ' + best, W / 2, 315, 30, '#ffeb3b');
    if (overTimer <= 0) text('Tap karo dobara khelne ke liye', W / 2, 390, 18);
  }
}

(function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
})();
</script>
